<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration Form</title>
  <style>
  body {
    background-image: url("https://duckduckgo.com/?q=funaab+library+picture&atb=v516-1&ia=images&iax=images&iai=https%3A%2F%2Ffunaab.edu.ng%2Fwp-content%2Fuploads%2F2023%2F08%2FNIMBE-ADEDIPE-LIBRARY.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  label { display: block; margin-top: 10px; font-weight: bold; }
  input[type="radio"] + label { display: inline; font-weight: normal; }
  fieldset { margin-bottom: 15px; }
</style>
</head>
<body>

  <header>
    <h1>Student Registration Form</h1>
  </header>

  <main>
    <form action="#" method="post">

      <fieldset>
        <legend>Personal Information</legend>

        <label for="name">Student Name</label>
        <input type="text" id="name" name="name" required>

        <label for="matric">Matric Number</label>
        <input type="text" id="matric" name="matric" required>
      </fieldset>
<fieldset>
        <legend>Department and Gender</legend>

        <label for="department">Department</label>
        <select id="department" name="department" required>
          <option value="">-- Select department --</option>
          <option value="csc">CSC</option>
          <option value="itct">ITCT</option>
          <option value="sen/ifs">SEN/IFS</option>
          <option value="cyb/dsc">CYB/DSC</option>
        </select>
        <p>Gender</p>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
      </fieldset>

      <fieldset>
        <legend>Contact Information</legend>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required>
      </fieldset>

      <fieldset>
        <legend>Programme</legend>

        <label for="programme">Programme</label>
        <select id="programme" name="programme" required>
          <option value="">-- Select programme --</option>
          <option value="fulltime">Full-time</option>
          <option value="part-time(weekday)">Part-Time(Weekday)</option>
          <option value="part-time(weekend)">Part-Time(Weekend)</option>
        </select>
      </fieldset>

      <button type="submit">Submit</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026/2027 Student Dossier</p>
  </footer>

</body>
</html>
